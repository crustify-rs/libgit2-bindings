[package]
name = "libgit2"
description = "Safe Rust wrappers over libgit2's public API."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[features]
default = ["libgit2"]
# One feature per link unit; each gates its module in src/lib.rs.
libgit2 = []

[dependencies]
# By path, not by Git: trybuild replaces only the paths of dependencies declared by path
# with `$FFIBOX` in compile-fail snapshots. glibc-bindings takes it by Git, which the
# [patch] below points at this path, so the graph holds one ffibox.
ffibox = { path = "/opt/venv/share/ffibox" }
# libc's wrapper, the crustify-rs/glibc-bindings side campaign: pinned to a commit
# (`wrapper.pin` in crustify/artifacts/dependencies.json), and patched below to its clone
# beside this repository while the campaign extends it.
glibc-bindings = { version = "0.1.0", git = "https://github.com/crustify-rs/glibc-bindings", rev = "787a8029dfccdc94d69f050855233ab8658b0c9d" }
pcre2-sys = "0.2"
libgit2-sys = { version = "0.1.0", path = "libgit2-sys" }

[dev-dependencies]
# The campaign's tests and gates regenerate the bindings, and check them against the
# committed ones; the crate's dependents build from the shipped bindings.
libgit2-sys = { version = "0.1.0", path = "libgit2-sys", features = ["bindgen"] }
trybuild = "1.0"

[lints]
workspace = true

[[test]]
name = "ub_safe"
path = "tests/ub_safe/main.rs"

[[test]]
name = "ub_unsafe"
path = "tests/ub_unsafe/main.rs"

[[test]]
name = "equiv"
path = "tests/equiv/main.rs"

[workspace]
resolver = "3"
members = [".", "libgit2-sys"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"
license = "GPL-2.0-only WITH GCC-exception-2.0"
repository = "https://github.com/crustify-rs/libgit2-bindings"
publish = false

[patch."https://github.com/crustify-rs/glibc-bindings"]
glibc-bindings = { path = "../glibc-bindings" }

[patch."https://github.com/crustify-rs/ffibox"]
ffibox = { path = "/opt/venv/share/ffibox" }

[workspace.metadata.crustify]
nightly = "nightly-2026-10-08"

[workspace.lints.rust]
nonstandard_style = { level = "deny", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
let_underscore_drop = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
cargo = { level = "warn", priority = -2 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
mem_forget = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
module_inception = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"

