[package]
name = "libgit2"
description = "Safe Rust wrappers over libgit2's public API."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[features]
default = ["libgit2"]
# One feature per link unit; each gates its module in src/lib.rs.
libgit2 = []

[dependencies]
ffibox = { path = "/opt/venv/share/ffibox" }
libc = "0.2"
pcre2-sys = "0.2"
libgit2-sys = { path = "libgit2-sys" }

[dev-dependencies]
libgit2-sys = { path = "libgit2-sys" }
trybuild = "1.0"

[lints]
workspace = true

[[test]]
name = "ub_safe"
path = "tests/ub_safe/main.rs"

[[test]]
name = "ub_unsafe"
path = "tests/ub_unsafe/main.rs"

[[test]]
name = "equiv"
path = "tests/equiv/main.rs"

[workspace]
resolver = "3"
members = [".", "libgit2-sys"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"
license = "GPL-2.0-only WITH GCC-exception-2.0"
repository = "https://github.com/crustify-rs/libgit2-bindings"
publish = false

[workspace.metadata.crustify]
nightly = "nightly-2026-10-08"

[workspace.lints.rust]
nonstandard_style = { level = "deny", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
let_underscore_drop = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
cargo = { level = "warn", priority = -2 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
mem_forget = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
module_inception = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
