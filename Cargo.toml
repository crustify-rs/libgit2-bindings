[package]
name = "libgit2"
description = "Safe Rust wrappers over libgit2's public API."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[features]
default = ["libgit2"]
# One feature per link unit; each gates its module in src/lib.rs.
libgit2 = []

[dependencies]
ffibox = { path = "/opt/venv/share/ffibox" }
libc = "0.2"
pcre2-sys = "0.2"
libgit2-sys = { path = "libgit2-sys" }

[dev-dependencies]
libgit2-sys = { path = "libgit2-sys" }
trybuild = "1.0"

[lints]
workspace = true

[[test]]
name = "ub_safe"
path = "tests/ub_safe/main.rs"

[[test]]
name = "ub_unsafe"
path = "tests/ub_unsafe/main.rs"

[[test]]
name = "equiv"
path = "tests/equiv/main.rs"

[workspace]
resolver = "3"
members = [".", "libgit2-sys"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "GPL-2.0-only WITH GCC-exception-2.0"
repository = "https://github.com/crustify-rs/libgit2-bindings"
publish = false

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
module_inception = "allow"
