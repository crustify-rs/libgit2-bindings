[package]
name = "libgit2-sys"
description = "Raw bindgen bindings to libgit2's public API."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
links = "git2"
build = "build.rs"

# Generated bindings are exempt from the workspace lints.

[lib]
# bindgen copies libgit2's C comments, whose indented C examples (such as
# `git_reference_iterator`'s) rustdoc would compile as Rust doctests.
doctest = false

[build-dependencies]
# Pinned exactly: the committed bindings are its output.
bindgen = { version = "=0.73.2", optional = true }
cc = "1.2"
pkg-config = "0.3"
serde_json = "1"

[features]
# Regenerates the bindings from the headers of the library found, in place of the shipped ones.
bindgen = ["dep:bindgen"]
